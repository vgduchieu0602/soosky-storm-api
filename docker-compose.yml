# Deploy TEST/STAGING cho VPS Ubuntu RAM thấp.
#
# Đúng MỘT container. Không có MongoDB ở đây: MONGO_URI trong .env trỏ tới
# MongoDB bên ngoài (Atlas).
#
# QUAN TRỌNG: 1 container = 1 alert scheduler. Scheduler quét bão chạy bên trong
# process Node, nên thêm replica là quét nhiều lần. Không scale service này.

services:
  api:
    build:
      context: .
    image: soosky-storm-api:latest
    container_name: soosky-storm-api
    restart: unless-stopped

    ports:
      # Cổng trên VPS: 3000 đã bị soosky-plant-care-api chiếm, 3002 là
      # soosky-weather-marine-api, nên service này dùng 3001.
      # Kiểm tra trước: sudo ss -ltnp | grep :3001
      # Cổng 3000 bên trong container không bao giờ xung đột.
      # Bind loopback: chỉ nginx vào được, không lộ ra Internet.
      - "127.0.0.1:${HOST_PORT:-3001}:3000"

    env_file:
      - .env

    environment:
      # Cố định bên trong container, độc lập với HOST_PORT ở trên.
      HTTP_HOST: "0.0.0.0"
      HTTP_PORT: "3000"
      # Trần V8 heap, để V8 gom rác trước khi kernel OOM-kill.
      # VPS 512MB -> 192 · 1GB -> 320 · 2GB+ -> 640
      NODE_OPTIONS: "--max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-320}"

    volumes:
      # File .p8 mount read-only. Trong .env đặt:
      #   APNS_PRIVATE_KEY_PATH=/run/secrets/apns/AuthKey_XXXXXXXXXX.p8
      - ./secrets/apns:/run/secrets/apns:ro

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Trần RAM cuối, container không thể ăn hết VPS.
    # Cache in-memory của app tối đa ~166MB (map tile 50 + forecast 32 + cone 32
    # + spaghetti 16 + history 16 + track 12 + current 8), cộng Node baseline
    # ~80MB -> 400m là mức an toàn. VPS 1GB+ có thể để 512m.
    mem_limit: ${MEM_LIMIT:-400m}
    memswap_limit: ${MEM_LIMIT:-400m}

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
