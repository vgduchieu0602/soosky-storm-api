# Soosky Storm API — nginx reverse proxy
#
#   sudo cp deploy/nginx/storm-api.conf /etc/nginx/sites-available/storm-api
#   sudo ln -s /etc/nginx/sites-available/storm-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d project3.vuonghieu.site
#
# certbot sẽ tự thêm block listen 443 + chứng chỉ vào file này.

server {
    listen 80;
    listen [::]:80;
    server_name project3.vuonghieu.site;

    location / {
        # Khớp HOST_PORT trong .env
        proxy_pass http://127.0.0.1:3001;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /v1/weather/forecast gọi tối đa 4 lần OpenWeather nối tiếp.
        proxy_read_timeout 60s;
    }
}
